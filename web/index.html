<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="card">
      <header>
        <h1>AI Voice Agent</h1>
        <p class="subtitle">Microphone streaming & AudioPlayer testing</p>
      </header>

      <!-- Connection / Session status -->
      <div class="status-container">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>

      <!-- Call Action buttons -->
      <div class="button-group">
        <button id="start-btn" class="btn btn-primary">Start call</button>
        <button id="stop-btn" class="btn btn-secondary" disabled>Stop call</button>
      </div>

      <!-- Dev / Audio Player Controls -->
      <div class="dev-section">
        <div class="dev-header">
          <h3>Dev Player Controls</h3>
          <span id="player-status" class="player-status-badge">Player Idle</span>
        </div>
        <div class="dev-button-group">
          <button id="test-tone-btn" class="btn btn-outline" disabled>Play test tone</button>
          <button id="flush-btn" class="btn btn-outline" disabled>Flush now</button>
          <button id="ask-clear-btn" class="btn btn-outline" disabled>Ask server to clear</button>
        </div>
      </div>

      <!-- Live audio level meter -->
      <div class="meter-section">
        <div class="meter-label">
          <span>Mic Level</span>
          <span id="meter-value">0%</span>
        </div>
        <div class="meter-track">
          <div id="meter-fill" class="meter-fill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Applied Browser Audio Settings -->
      <div class="settings-section">
        <h3>Applied Audio Settings</h3>
        <div id="settings-grid" class="settings-grid">
          <div class="setting-item">
            <span class="label">Sample Rate:</span>
            <span class="val" id="setting-sample-rate">—</span>
          </div>
          <div class="setting-item">
            <span class="label">Channels:</span>
            <span class="val" id="setting-channels">—</span>
          </div>
          <div class="setting-item">
            <span class="label">Echo Cancellation:</span>
            <span class="val" id="setting-echo">—</span>
          </div>
          <div class="setting-item">
            <span class="label">Noise Suppression:</span>
            <span class="val" id="setting-noise">—</span>
          </div>
          <div class="setting-item">
            <span class="label">Auto Gain Control:</span>
            <span class="val" id="setting-gain">—</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
